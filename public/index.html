<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title> VariousJS </title>
<link href="./dist/assets/style.css" rel="stylesheet" />
<script>
var VARIOUS_CONFIG = {
  dependencies: {
    react: 'https://esm.sh/react@19.2.0',
    'react-dom': 'https://esm.sh/react-dom@19.2.0?deps=react@19.2.0',
    'react-dom/client': 'https://esm.sh/react-dom@19.2.0/client?deps=react@19.2.0',
    'react-router-dom': 'https://esm.sh/react-router-dom@6.22.1?deps=react@19.2.0,react-dom@19.2.0',
    vue: 'https://esm.sh/vue@3.5.40',

    app: './dist/app.js',
    card: './dist/card.js',
    next: './dist/next.js',
    top: './dist/top.js'
  },
  pages: [
    {
      path: '/',
      components: ['card', 'next']
    },
    {
      path: '/next/:id',
      components: ['card', 'next']
    },
    {
      path: '/error',
      components: ['error']
    }
  ],
  links: [
    {
      name: 'Home',
      path: '/'
    },
    {
      name: 'Next',
      path: '/next/5'
    },
    {
      name: 'Error',
      path: '/error'
    }
  ],
  i18n: {
    defaultLocale: 'zh'
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@variousjs/various@6/dist/loader.js"></script>
</body>
</html>
